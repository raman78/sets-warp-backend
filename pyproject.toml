[project]
name = "sets-warp-backend"
version = "0.1.0"
description = "WARP Knowledge Backend — community icon recognition for SETS-WARP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "huggingface-hub>=0.24.0",
    "pydantic>=2.6.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Maintainer-only console (admin_console.py + admin_reject_crops.py). NOT
# installed on the HF Space Docker runtime — only for local maintainer use
# with a write token. `sto-warp` supplies the cargo name list (RELABEL
# validation) via warp.data.cargo; the tools also fall back to a sibling
# sto-warp checkout when it isn't pip-installed.
admin = ["PySide6>=6.6.0", "sto-warp"]
# Test suite (`tests/`). Not installed on the HF Space runtime either — the
# suite runs on a maintainer's machine and in CI, never in production.
dev = ["pytest>=8.0"]

[project.scripts]
warp-backend-setup = "setup:main"
warp-backend       = "main:app"

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# `tests/` only. `test_backend.py` in the root matches pytest's default
# discovery pattern but is not a unit test — it is the smoke script that talks
# to the live HF Space, and a bare `pytest` collecting it sends real requests
# to production (and errors on `test_contribute`, which takes a screenshot
# path). Run it deliberately: `python test_backend.py <screenshot>`.
testpaths = ["tests"]

[tool.sets-warp-backend]
# Backend configuration — edit before deploying
# Values can be overridden by environment variables (HF_TOKEN, HF_REPO_ID, ...)

[tool.sets-warp-backend.huggingface]
repo_id   = "sets-sto/warp-knowledge"
# token — do NOT put it here. Set the HF_TOKEN environment variable,
# or put it in .env (which is gitignored)

[tool.sets-warp-backend.server]
host            = "0.0.0.0"
port            = 8000
max_req_per_ip  = 500

[tool.sets-warp-backend.storage]
# How many days to keep raw contributions before they are archived
contribution_retention_days = 90
# Minimum number of confirmations before an entry enters knowledge.json
min_confirmations = 2
