# LEGACY FALLBACK — not the live host. Production runs as a HuggingFace
# Space (sets-sto/warp-backend, sets-sto-warp-backend.hf.space), deployed by
# deploy_space.py / .github/workflows/deploy_space.yml. This blueprint is kept
# only as a Render fallback; the shipped sto-warp client points at the Space.
services:
  - type: web
    name: sets-warp-backend
    runtime: python
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_REPO_ID
        value: sets-sto/warp-knowledge
      - key: ADMIN_KEY
        generateValue: true
      - key: MAX_REQ_PER_IP
        value: "500"
    healthCheckPath: /health
