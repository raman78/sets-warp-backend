# .github/workflows/train_central_model.yml
#
# Automated WARP Central Model Training — GitHub Actions
# =======================================================
# Runs every 6 hours. If no new crops arrived since last training:
# exits in ~60 seconds (no compute wasted). Otherwise trains
# EfficientNet-B0 on community crops and publishes to HF — a real run
# takes up to ~5 h (ICON_TRAIN_BUDGET_S in admin_train.py).
#
# Why 6 hours: a real run is longer than an hour, and two runs at once
# would train on the same data and race each other to publish. The 6 h
# cadence keeps them apart by construction (the job is capped at 330 min);
# the `concurrency` group below is the guard for a delayed scheduled start
# or a manual dispatch. It never cancels a running job — the waiting run
# queues, and GitHub keeps only the newest waiting one.
#
# GitHub Actions for PUBLIC repos = unlimited free minutes.
#
# SETUP (one-time):
#   GitHub repo → Settings → Secrets and variables → Actions → New secret:
#     HF_TOKEN   = <your HF write token>
#
# Optional secrets (if HF repos differ from defaults):
#     HF_DATASET = sets-sto/sto-icon-dataset
#     HF_REPO_ID = sets-sto/warp-knowledge

name: Train Central Model

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours, on the hour (00, 06, 12, 18 UTC)
  workflow_dispatch:        # allow manual trigger from GitHub UI
    inputs:
      force_retrain:
        description: 'Force re-training even if crops are unchanged'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: train-central-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    # GitHub's own cap is 360. The script shares out 330: icon classifier
    # 270, screen classifier 8 + one epoch, upload — see admin_train.py.
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'       # cache ~/.cache/pip between runs

      - name: Cache Hugging Face downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-crops-${{ github.sha }}
          restore-keys: |
            hf-crops-

      - name: Install dependencies
        run: |
          pip install --quiet \
            torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet \
            opencv-python-headless \
            huggingface_hub

      - name: Train and publish model
        env:
          HF_TOKEN:   ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ secrets.HF_DATASET || 'sets-sto/sto-icon-dataset' }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID || 'sets-sto/warp-knowledge' }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_retrain }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          # -u: unbuffered, so the log shows each line when it happens and a
          # traceback in its place, not all of it at exit.
          python -u admin_train.py --train --skip-if-unchanged --min 1 $FORCE_FLAG
