# .github/workflows/tests.yml
#
# Run the test suite on every push and pull request to main.
#
# Nothing ran `pytest` before this. A test broken by 356f9f3 (2026-09-18)
# stayed red for nine days and was found by chance while working on
# something else. A red suite now fails the commit and mails the owner,
# the same way a failed training run does.
#
# Python 3.12 matches the Space image (space/Dockerfile). torch is the CPU
# wheel, so the trainer tests run instead of skipping.
#
# The admin tools read sto-warp from a checkout beside this repo
# (`_STO_WARP_SIBLING` in admin_reject_crops.py), which is how the tests
# pass on the maintainer's machine. sto-warp needs Python 3.14 to pip
# install, so it is cloned to the same place instead. PySide6 is the other
# half of the `admin` extra. The one test still skipped here,
# test_a_real_store_is_fully_accepted, checks a real client's anchors.json
# and has nothing to read on a runner.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # libegl1 + libxkbcommon0 + libfontconfig1: the system libraries
        # PySide6 loads even offscreen; the runner image has none of them.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 > /dev/null
          pip install --quiet \
            torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt pytest pyyaml httpx PySide6

      - name: Clone sto-warp beside this repo
        run: git clone --depth 1 https://github.com/raman78/sto-warp.git ../sto-warp

      - name: Run tests
        run: python -m pytest tests/ -q -rs
